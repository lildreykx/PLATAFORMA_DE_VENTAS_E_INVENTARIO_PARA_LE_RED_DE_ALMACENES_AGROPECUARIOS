<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGRO CORE | Administrador</title>
  <style>
    :root {
      --primary: #10a77b;
      --primary-dark: #087b5a;
      --bg: #f4f7f7;
      --card-bg: #ffffff;
      --text: #17191b;
      --muted: #656a70;
      --border: #dfe3e6;
      --danger: #d32f2f;
      --warning: #fbc02d;
      --success: #07966e;
      --shadow: 0 10px 24px rgba(20, 24, 28, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .title-block h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.1;
    }

    .title-block small {
      color: var(--muted);
      display: block;
      margin-top: 6px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    a.button-link, button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    button.btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #d4d8db;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 167, 123, 0.12);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .toolbar button {
      flex: 1 1 140px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f4f6f7;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .map-wrapper {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, #edf8ff 0%, #f6fbff 100%);
      margin-top: 20px;
    }

    .map-wrapper svg {
      width: 100%;
      height: 320px;
      display: block;
    }

    .warehouse-marker {
      fill: #d94f4f;
      stroke: #fff;
      stroke-width: 2;
    }

    .warehouse-marker.ok {
      fill: #2ca36b;
    }

    .warehouse-label {
      font-size: 12px;
      fill: #1d2a36;
      font-weight: 700;
    }

    .warehouse-pill {
      fill: rgba(255,255,255,0.92);
      stroke: rgba(18, 35, 52, 0.18);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #203c25;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .toast.error {
      background: #8d2020;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .map-wrapper svg {
        height: auto;
        aspect-ratio: 420 / 760;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-block">
      <h1>AGRO CORE</h1>
      <small>Administrador</small>
    </div>
    <div class="header-actions">
      <a class="button-link" href="/Httml">Volver a la operación</a>
    </div>
  </header>

  <div class="layout">
    <div class="card">
      <h3>Administración de inventario</h3>

      <div class="form-group">
        <label>Producto:</label>
        <select id="adminProductSelect" onchange="loadSelectedAdminProduct()">
          <option value="">Nuevo producto</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" id="adminName" placeholder="Ej: Bioestimulante Plus" />
      </div>

      <div class="form-group">
        <label>Precio:</label>
        <input type="number" id="adminPrice" min="0" step="1000" value="0" />
      </div>

      <div class="form-group">
        <label>Stock actual:</label>
        <input type="number" id="adminStock" min="0" step="1" value="0" />
      </div>

      <div class="form-group">
        <label>Stock mínimo:</label>
        <input type="number" id="adminMinStock" min="0" step="1" value="0" />
      </div>

      <div class="form-group">
        <label>Sede:</label>
        <select id="adminBranch">
          <option value="Apartadó">Apartadó</option>
          <option value="Chigorodó">Chigorodó</option>
        </select>
      </div>

      <div class="form-group">
        <label>Almacén / ubicación:</label>
        <input type="text" id="adminWarehouse" placeholder="Ej: Almacén Norte, Bodega central" />
      </div>

      <div class="form-group">
        <label>Lote:</label>
        <input type="text" id="adminLot" placeholder="Ej: LOT-2026-Z1" />
      </div>

      <div class="form-group">
        <label>Fecha de caducidad:</label>
        <input type="date" id="adminExp" />
      </div>

      <div class="toolbar">
        <button class="btn-primary" onclick="saveAdminProduct()">Guardar producto</button>
        <button type="button" onclick="clearAdminForm()">Limpiar</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>Productos activos</h3>
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Stock</th>
              <th>Almacén</th>
              <th>Sede</th>
            </tr>
          </thead>
          <tbody id="adminInventoryTable">
            <tr><td colspan="4">Sin productos.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="card" style="margin-top: 24px;">
        <h3>Ubicación del stock en Urabá</h3>
        <div class="map-wrapper">
          <svg id="warehouseMap" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet" aria-label="Mapa de distribución del stock en Urabá"></svg>
        </div>
      </div>
    </div>
  </div>

  <script src="/uraba-map.js"></script>
  <script>
    const fallbackInventory = [
      { id: '1', name: 'Fertilizante Úrea 46%', price: 120000, stock: 15, minStock: 10, lot: 'UT-9921', exp: '2027-05-12', branch: 'Apartadó', warehouse: 'Almacén Norte' },
      { id: '2', name: 'Agroquímico BananoProtect', price: 85000, stock: 4, minStock: 8, lot: 'BP-8812', exp: '2026-11-30', branch: 'Chigorodó', warehouse: 'Bodega Central' },
      { id: '3', name: 'Abono Complejo NPK', price: 140000, stock: 2, minStock: 5, lot: 'NPK-001', exp: '2028-01-15', branch: 'Apartadó', warehouse: 'Patio de carga' },
      { id: '4', name: 'Fungicida Agrícola Premium', price: 95000, stock: 0, minStock: 5, lot: 'FG-4401', exp: '2026-12-01', branch: 'Chigorodó', warehouse: 'Bodega Sur' },
      { id: '5', name: 'Urea Precisagro 46% x 50 kg', price: 124000, stock: 0, minStock: 5, lot: 'POR-RECIBIR', exp: 'N/A', branch: 'Apartadó', warehouse: 'Por recibir' },
      { id: '6', name: 'Nutrimon NPK 10-20-20 x 50 kg', price: 253200, stock: 0, minStock: 5, lot: 'POR-RECIBIR', exp: 'N/A', branch: 'Apartadó', warehouse: 'Por recibir' },
      { id: '7', name: 'Agrimins 8-5-0-6 Colinagro x 46 kg', price: 162000, stock: 0, minStock: 5, lot: 'POR-RECIBIR', exp: 'N/A', branch: 'Apartadó', warehouse: 'Por recibir' },
      { id: '8', name: 'Nutrimon Producción 17-6-18-2 x 50 kg', price: 170900, stock: 0, minStock: 5, lot: 'POR-RECIBIR', exp: 'N/A', branch: 'Apartadó', warehouse: 'Por recibir' },
      { id: '9', name: 'Banagen 250 EC x 250 ml', price: 26000, stock: 0, minStock: 2, lot: 'POR-RECIBIR', exp: 'N/A', branch: 'Apartadó', warehouse: 'Por recibir' }
    ];

    let inventory = [...fallbackInventory];
    const branchWarehouseMap = {
      'Apartadó': { x: 190, y: 170 },
      'Chigorodó': { x: 430, y: 142 }
    };

    function renderAdminInventoryTable() {
      const tbody = document.getElementById('adminInventoryTable');
      tbody.innerHTML = inventory.map(item => `
        <tr>
          <td>${item.name}</td>
          <td>${item.stock}</td>
          <td>${item.warehouse || item.branch}</td>
          <td>${item.branch}</td>
        </tr>
      `).join('') || '<tr><td colspan="4">Sin productos.</td></tr>';
    }

    function renderAdminProductSelect() {
      const select = document.getElementById('adminProductSelect');
      select.innerHTML = '<option value="">Nuevo producto</option>' + inventory.map(item => `<option value="${item.id}">${item.name}</option>`).join('');
    }

    function populateAdminForm(product) {
      document.getElementById('adminName').value = product ? product.name : '';
      document.getElementById('adminPrice').value = product ? product.price : 0;
      document.getElementById('adminStock').value = product ? product.stock : 0;
      document.getElementById('adminMinStock').value = product ? product.minStock : 0;
      document.getElementById('adminBranch').value = product ? product.branch : 'Apartadó';
      document.getElementById('adminWarehouse').value = product ? (product.warehouse || product.branch) : 'Almacén Norte';
      document.getElementById('adminLot').value = product ? product.lot : '';
      document.getElementById('adminExp').value = product ? product.exp : '';
    }

    function clearAdminForm() {
      document.getElementById('adminProductSelect').value = '';
      populateAdminForm(null);
    }

    function loadSelectedAdminProduct() {
      const id = document.getElementById('adminProductSelect').value;
      if (!id) {
        populateAdminForm(null);
        return;
      }
      const product = inventory.find(item => String(item.id) === String(id));
      if (product) populateAdminForm(product);
    }

    function persistInventoryState() {
      try {
        localStorage.setItem('agroInventoryState', JSON.stringify(inventory));
      } catch (error) {
        console.warn('No se pudo conservar el inventario local:', error);
      }
    }

    function loadStoredInventoryState() {
      try {
        const stored = JSON.parse(localStorage.getItem('agroInventoryState') || 'null');
        if (Array.isArray(stored) && stored.length) inventory = stored;
      } catch (error) {
        console.warn('No se pudo leer el inventario local:', error);
      }
    }

    function showMessage(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast${isError ? ' error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    function saveAdminProduct() {
      const selectedId = document.getElementById('adminProductSelect').value;
      const name = document.getElementById('adminName').value.trim();
      const price = Number(document.getElementById('adminPrice').value || 0);
      const stock = Number(document.getElementById('adminStock').value || 0);
      const minStock = Number(document.getElementById('adminMinStock').value || 0);
      const branch = document.getElementById('adminBranch').value;
      const warehouse = document.getElementById('adminWarehouse').value.trim() || branch;
      const lot = document.getElementById('adminLot').value.trim() || 'N/A';
      const exp = document.getElementById('adminExp').value;

      if (!name) {
        showMessage('Escribe el nombre del producto.', true);
        return;
      }

      if (selectedId) {
        const product = inventory.find(item => String(item.id) === String(selectedId));
        if (product) {
          product.name = name;
          product.price = price;
          product.stock = stock;
          product.minStock = minStock;
          product.branch = branch;
          product.warehouse = warehouse;
          product.lot = lot;
          product.exp = exp || product.exp || '';
        }
      } else {
        inventory.push({
          id: String(Date.now()),
          name,
          price,
          stock,
          minStock,
          branch,
          warehouse,
          lot,
          exp
        });
      }

      renderAdminProductSelect();
      renderAdminInventoryTable();
      renderWarehouseMap();
      persistInventoryState();
      clearAdminForm();
      showMessage('Producto actualizado en el inventario.');
    }

    function renderWarehouseMap() {
      window.drawUrabaMap('warehouseMap');
    }

    async function initAdminDashboard() {
      loadStoredInventoryState();
      try {
        const response = await fetch('/api/products');
        if (response.ok) {
          const serverInventory = await response.json();
          const localIds = new Set(inventory.map(item => String(item.id)));
          if (Array.isArray(serverInventory)) {
            inventory.push(...serverInventory.filter(item => !localIds.has(String(item.id))));
            persistInventoryState();
          }
        }
      } catch (error) {
        console.warn('No se pudo cargar el catálogo SQL en administración:', error);
      }
      renderAdminProductSelect();
      renderAdminInventoryTable();
      renderWarehouseMap();
    }

    window.addEventListener('load', initAdminDashboard);
  </script>
</body>
</html>
